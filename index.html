<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>QR Bölge Tanıtım - Küre Dağları</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f0f4ea;
      --card: #ffffff;
      --text: #162326;
      --muted: #52636a;
      --line: #dbe5df;
      --accent: #007258;
      --accent-2: #0c5f9a;
      --soft: #f6fbf8;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Manrope", "Segoe UI", Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 8% 0%, #ffffff 0%, #f8fbf9 38%, transparent 70%),
        linear-gradient(180deg, #eff6f0 0%, #e9f2ee 100%);
    }

    .wrap {
      max-width: 980px;
      margin: 0 auto;
      padding: 24px 16px 40px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 20px;
      box-shadow: 0 14px 40px rgba(13, 42, 33, 0.1);
    }

    .tag {
      display: inline-block;
      font-size: 12px;
      color: #0f6a5a;
      padding: 7px 12px;
      border: 1px solid #c4dfd7;
      border-radius: 999px;
      margin-bottom: 10px;
      background: #eef9f4;
    }

    h1 {
      margin: 0 0 8px;
      font-size: clamp(24px, 4.4vw, 36px);
      line-height: 1.2;
    }

    .sub {
      margin: 0 0 16px;
      color: var(--muted);
      line-height: 1.5;
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 20px 0;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    .hero {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: #dfeee7;
      min-height: 260px;
      margin-bottom: 16px;
    }

    .hero img {
      width: 100%;
      height: 320px;
      object-fit: cover;
      object-position: center;
      background: #e6efe9;
      display: block;
    }

    .hero-info {
      position: absolute;
      left: 14px;
      right: 14px;
      bottom: 14px;
      background: rgba(9, 35, 32, 0.62);
      color: #f5fffc;
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 14px;
      line-height: 1.45;
    }

    .map-frame {
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      background: #eef6f1;
    }

    iframe {
      width: 100%;
      min-height: 320px;
      border: 0;
      display: block;
    }

    .waterflow {
      margin-top: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: var(--soft);
      line-height: 1.55;
      font-size: 14px;
    }

    .waterflow strong {
      display: block;
      margin-bottom: 8px;
      color: #154a74;
    }

    .video-shell {
      border: 1px solid var(--line);
      border-radius: 14px;
      overflow: hidden;
      background: #000;
    }

    video {
      width: 100%;
      display: block;
      aspect-ratio: 16 / 9;
    }

    .audio-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .audio-item {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 15px;
      background: var(--soft);
    }

    .audio-item strong {
      display: block;
      margin-bottom: 10px;
      font-size: 15px;
      color: var(--accent);
    }

    audio {
      width: 100%;
    }

    .meta {
      margin-top: 14px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 10px;
    }

    .gallery figure {
      margin: 0;
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
    }

    .gallery img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
    }

    .gallery figcaption {
      padding: 8px 10px;
      font-size: 12px;
      color: var(--muted);
    }

    .lang-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .btn {
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 10px;
      padding: 8px 12px;
      cursor: pointer;
      color: var(--text);
      font-weight: 600;
    }

    .btn.active {
      background: #e8f9f3;
      border-color: #b8e0d2;
      color: #04573f;
    }

    .preview {
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 15px;
      background: var(--soft);
      white-space: pre-wrap;
      line-height: 1.7;
      margin-bottom: 12px;
      font-size: 15px;
    }

    textarea {
      width: 100%;
      min-height: 250px;
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px;
      font: inherit;
      display: none; /* Düzenleme alanını varsayılan olarak gizledik */
    }
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <span class="tag">🌿 Milli Park Rehberi</span>
      <h1 id="title">Yükleniyor...</h1>
      <p id="description" class="sub"></p>

      <div class="hero">
        <img id="heroImage" src="assets/images/selale-kapak.jpg" alt="Küre Dağları Kapak" />
        <div class="hero-info" id="heroCaption"></div>
      </div>

      <div class="divider"></div>

      <h2 class="section-title">Konum ve Su Sistemi</h2>
      <div class="map-frame">
        <iframe id="waterMap" title="Harita" loading="lazy" src=""></iframe>
      </div>
      <div class="waterflow" id="waterflowText"></div>

      <div class="divider"></div>

      <h2 class="section-title">Sesli Rehber</h2>
      <div class="lang-row">
        <button type="button" class="btn active" id="voiceTR">TR</button>
        <button type="button" class="btn" id="voiceEN">EN</button>
        <button type="button" class="btn" id="voiceDE">DE</button>
      </div>
      <div class="audio-grid">
        <div class="audio-item">
          <strong id="audioTrack1Label">Sesli Anlatım</strong>
          <audio controls preload="metadata" id="audio1"></audio>
          <div class="meta" id="audio1Status"></div>
        </div>
      </div>

      <div class="divider"></div>

      <h2 class="section-title">Tanıtım Videosu</h2>
      <div class="video-shell">
        <iframe width="100%" height="360" src="https://www.youtube.com/watch?v=4EUIi1N4FLA" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
      </div>

      <div class="divider"></div>

      <h2 class="section-title">Fotoğraf Galerisi</h2>
      <div class="gallery" id="galleryGrid"></div>

      <div class="divider"></div>

      <h2 class="section-title">Bölge Hakkında Bilgi</h2>
      <div class="lang-row">
        <button type="button" class="btn active" id="btnTR">Türkçe</button>
        <button type="button" class="btn" id="btnEN">English</button>
      </div>
      <div id="textPreview" class="preview"></div>

      <textarea id="textTR">Karadeniz’in Vahşi Cenneti: Küre Dağları Milli Parkı
Neden Görmelisiniz?
Küre Dağları, sıradan bir ormanlık alan değil; Avrupa'nın en seçkin koruma alanlarından (PAN Parks) biri ve bir "Platin Yabanıl Sertifikası" sahibidir. Burası, doğanın kendi kurallarını koyduğu gerçek bir vahşi yaşam sığınağıdır.

Kanyonlar Başkenti: Bin metreyi aşan derinliğiyle dünyanın sayılı kanyonlarından olan Valla Kanyonu ve üzerinde yürürken boşlukta süzülüyormuşsunuz hissi veren Çatak Kanyonu Cam Seyir Terası sadece buraya özgü nefes kesici manzaralar sunar.

Dünya Çapında Mağaralar: Keşfedilmiş 77 mağarasıyla bir yer altı labirentidir. Özellikle dünyanın en büyük 4. mağarası olan Ilgarini Mağarası, hem coğrafi hem de tarihi bir şaheserdir.

Neler Yapabilirsiniz?
Küre Dağları'nda ister adrenalinin sınırlarını zorlayın, ister sadece suyun sesini dinleyerek ruhunuzu dinlendirin:

Kanyonun İçinde Yürüyüş: Pınarbaşı'nda kayalara ahşap bir nakış gibi işlenmiş 3 kilometrelik Horma Kanyonu Yürüyüş Yolu'nda yürüyüp yolun sonundaki Ilıca Şelalesi'nin serin sularında yorgunluk atabilirsiniz.

Macera ve Kamp: Bartın Aşağıköy'de Zipline ile ormanın üzerinde uçabilir, Şenpazar Kızılcasu Kamp Alanı'nda çadırınızı veya karavanınızı kurup doğayla baş başa, yıldızların altında uyuyabilirsiniz.

Bölgenin Sırrı ve Efsaneleri
"Küre" İsmi Nereden Geliyor? Bu görkemli dağların ismi, bölgenin binlerce yıllık madencilik geçmişinden gelir. Kastamonu ve çevresi Antik Çağ'dan beri önemli bir bakır çıkarım merkezidir. "Küre", eski dilde madenleri eritmek için kullanılan devasa döküm fırınlarına verilen isimdir.

Ulukaya Şelalesi'nin Hüzünlü Aşk Efsanesi: Efsaneye göre; antik çağlarda Selamnos adında bir genç, güzeller güzeli Hera'ya aşık olur ancak Hera onu terk eder. Aşk acısına dayanamayan Selamnos kendini Ulukaya'nın zirvesinden boşluğa bırakır. Aşk tanrısı Eros bu duruma çok üzülür ve gencin bedenini, o kayalardan sonsuza dek akacak bir şelaleye dönüştürür. Yöre halkı bugün bile, şelalenin suyundan içenlerin aşk acısının dineceğine inanır.</textarea>
      <textarea id="textEN">The Wild Paradise of the Black Sea: Küre Mountains National Park
Why You Should Visit?
The Küre Mountains are not just an ordinary forested area; they are one of Europe's most distinguished protected areas (PAN Parks) and hold a "Platinum Wilderness Certificate." This is a true wildlife sanctuary where nature sets its own rules.

Capital of Canyons: Valla Canyon, one of the world's most remarkable canyons with a depth exceeding one thousand meters, and the Çatak Canyon Glass Viewing Terrace offer breathtaking views unique to this place.

World-Class Caves: It is an underground labyrinth with 77 discovered caves. Ilgarini Cave, the 4th largest cave in the world, is both a geographical and historical masterpiece.

What You Can Do?
Walking in the Canyon: In Pınarbaşı, you can walk the 3-kilometer Horma Canyon Walking Trail and relieve your fatigue in the cool waters of the Ilıca Waterfall.

Adventure and Camping: In Bartın Aşağıköy, you can fly over the forest with a zipline, or stay at the Şenpazar Kızılcasu Campsite.

Secrets and Legends
Where Does the Name "Küre" Come From? The name comes from the region's millennia-old mining history. "Küre" is the name given in ancient times to the gigantic casting furnaces used to melt metals.

The Legend of Ulukaya Waterfall: According to the legend, a young man named Selamnos threw himself from the summit due to heartbreak. The god Eros transformed his body into a waterfall. It is believed that drinking this water heals the pain of love.</textarea>
    </section>
  </main>

  <script>
    const PROD_BASE = "https://2076385.github.io/qr-masa/";
    const runtimeBase = location.protocol === "file:" ? "" : (location.hostname.endsWith("github.io") ? PROD_BASE : "./");

    const REGIONS = {
      "kure-daglari": {
        title: "Küre Dağları Milli Parkı",
        description: "Avrupa'nın en vahşi ve korunmuş doğasına hoş geldiniz. Ilıca Şelalesi ve kanyonlar bölgesindesiniz.",
        heroImage: `${runtimeBase}assets/images/selale-kapak.jpg`,
        heroCaption: "Ilıca Şelalesi - Pınarbaşı, Kastamonu",
        mapEmbed: "https://www.openstreetmap.org/export/embed.html?bbox=32.95,41.55,33.15,41.75&layer=mapnik",
        waterflowText: "Horma Kanyonu -> Ilıca Şelalesi -> Devrekani Çayı -> Karadeniz",
        videoSrc: `${runtimeBase}assets/video/mikro-belgesel.mp4`,
        gallery: [
          { src: `${runtimeBase}assets/images/galeri-1.jpg`, caption: "Horma Kanyonu" },
          { src: `${runtimeBase}assets/images/galeri-2.jpg`, caption: "Valla Kanyonu" },
          { src: `${runtimeBase}assets/images/galeri-3.jpg`, caption: "Ilıca Şelalesi" },
          { src: `${runtimeBase}assets/images/galeri-4.jpg`, caption: "Mağara Oluşumları" }
        ],
        voiceByLang: {
          tr: { label: "Sesli Anlatım (TR)", audio: `${runtimeBase}assets/ses1.mp3`},
          en: { label: "Audio Guide (EN)", audio: `${runtimeBase}assets/ses2.mp3` },
          de: { label: "Audio-Guide (DE)", audio: `${runtimeBase}assets/ses3.mp3` }
        }
      }
    };

    const params = new URLSearchParams(window.location.search);
    const key = (params.get("bolge") || "kure-daglari").toLowerCase();
    const data = REGIONS[key] || REGIONS["kure-daglari"];
    let currentLang = "tr";
    let voiceLang = "tr";

    function bindAudio(audioEl, statusEl, localPath, driveId) {
      statusEl.textContent = "Yükleniyor...";
      audioEl.src = localPath;
      audioEl.onerror = () => {
         statusEl.textContent = "Yerel dosya bulunamadı, bulut sistemi deneniyor...";
         audioEl.src = `https://drive.google.com/uc?export=download&id=${driveId}`;
      };
      audioEl.oncanplay = () => statusEl.textContent = "";
    }

    function renderPage() {
      document.getElementById("title").textContent = data.title;
      document.getElementById("description").textContent = data.description;
      document.getElementById("heroImage").src = data.heroImage;
      document.getElementById("heroCaption").textContent = data.heroCaption;
      document.getElementById("waterMap").src = data.mapEmbed;
      document.getElementById("waterflowText").innerHTML = `<strong>Su Akış Hattı:</strong> ${data.waterflowText}`;

      // Galeri
      const galleryGrid = document.getElementById("galleryGrid");
      galleryGrid.innerHTML = "";
      data.gallery.forEach(item => {
        galleryGrid.innerHTML += `<figure><img src="${item.src}"><figcaption>${item.caption}</figcaption></figure>`;
      });

      renderText();
      renderAudio();
    }

    function renderText() {
      const val = currentLang === "tr" ? document.getElementById("textTR").value : document.getElementById("textEN").value;
      document.getElementById("textPreview").textContent = val;
      document.getElementById("btnTR").classList.toggle("active", currentLang === "tr");
      document.getElementById("btnEN").classList.toggle("active", currentLang === "en");
    }

    function renderAudio() {
      const pack = data.voiceByLang[voiceLang] || data.voiceByLang.tr;
      document.getElementById("audioTrack1Label").textContent = pack.label;
      bindAudio(document.getElementById("audio1"), document.getElementById("audio1Status"), pack.audio, pack.drive);
      
      document.getElementById("voiceTR").classList.toggle("active", voiceLang === "tr");
      document.getElementById("voiceEN").classList.toggle("active", voiceLang === "en");
      document.getElementById("voiceDE").classList.toggle("active", voiceLang === "de");
    }

    // Event Listeners
    document.getElementById("btnTR").onclick = () => { currentLang = "tr"; renderText(); };
    document.getElementById("btnEN").onclick = () => { currentLang = "en"; renderText(); };
    document.getElementById("voiceTR").onclick = () => { voiceLang = "tr"; renderAudio(); };
    document.getElementById("voiceEN").onclick = () => { voiceLang = "en"; renderAudio(); };
    document.getElementById("voiceDE").onclick = () => { voiceLang = "de"; renderAudio(); };

    renderPage();
  </script>
</body>
</html>
